name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
            exe: PicoEngine.exe
          - os: ubuntu-latest
            suffix: linux-x64
            exe: PicoEngine
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang g++ lld ninja-build pkg-config \
            libvulkan-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-2.0-dev libudev-dev \
            libasound2-dev libpulse-dev
          cur=$(cmake --version | head -n1 | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          if [ "$(printf '%s\n' '4.1' "$cur" | sort -V | head -n1)" != '4.1' ]; then
            sudo python3 -m pip install --upgrade --break-system-packages cmake
          fi
          clang --version
          cmake --version
          ninja --version

      - name: Install toolchain and Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          choco upgrade llvm -y --no-progress
          $cmakeOut = (cmake --version | Select-Object -First 1)
          if ($cmakeOut -notmatch '([0-9]+)\.([0-9]+)') { throw "Cannot parse CMake version: $cmakeOut" }
          if ([int]$Matches[1] -lt 4 -or ([int]$Matches[1] -eq 4 -and [int]$Matches[2] -lt 1)) {
            choco upgrade cmake -y --no-progress
          }
          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          if (-not $ninja) { choco install ninja -y --no-progress }
          clang --version
          cmake --version
          ninja --version
          $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Invoke-WebRequest -Uri 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe' -OutFile $installer
          & $installer --accept-licenses --default-answer --confirm-command install | Out-Null
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Vulkan SDK not found under C:\VulkanSDK' }
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: .fc-cache
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('external/**', 'CMakeLists.txt', 'src/CMakeLists.txt', 'pch/**') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure (RelWithDebInfo)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DFETCHCONTENT_BASE_DIR=$GITHUB_WORKSPACE/.fc-cache" \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Package zip
        run: |
          cmake -E make_directory "dist/PicoEngine"
          cmake -E copy "build/bin/${{ matrix.exe }}" "dist/PicoEngine/"
          cmake -E copy_directory "build/bin/assets" "dist/PicoEngine/assets"
          cd dist
          cmake -E tar cf "PicoEngine-${{ matrix.suffix }}-RelWithDebInfo.zip" --format=zip -- PicoEngine

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicoEngine-${{ matrix.suffix }}-RelWithDebInfo
          path: dist/PicoEngine-${{ matrix.suffix }}-RelWithDebInfo.zip
          if-no-files-found: error
